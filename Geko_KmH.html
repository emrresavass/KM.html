<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klasik65 - GPS Hiz Gateway</title>
  <style>
    body {
      background-color: #121212;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 30px 15px;
      margin: 0;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #AAAAAA;
      margin-bottom: 20px;
    }
    .speed-card {
      background: #1E1E1E;
      border: 2px solid #333333;
      border-radius: 20px;
      padding: 40px 10px;
      margin: 20px auto;
      max-width: 320px;
    }
    .speed-val {
      font-size: 5rem;
      font-weight: 800;
      color: #00E5FF;
      line-height: 1;
    }
    .unit {
      font-size: 1.1rem;
      color: #888888;
      margin-top: 10px;
      letter-spacing: 1px;
    }
    button {
      background: #E50914;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 16px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      width: 80%;
      max-width: 300px;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    button:disabled {
      background: #2E7D32;
      box-shadow: none;
    }
    #status {
      margin-top: 25px;
      font-size: 0.9rem;
      color: #FFC107;
    }
    .details {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>KLASIK 1965</h1>

  <div class="speed-card">
    <div class="speed-val" id="dispSpeed">0</div>
    <div class="unit">KM/H</div>
  </div>

  <button id="btnConnect" onclick="connectBLE()">GÖSTERGEYE BAĞLAN</button>
  <div id="status">Bağlantı bekleniyor...</div>
  <div class="details" id="gpsStatus">GPS: Beklemede</div>

  <script>
    const SERVICE_UUID = "0000180d-0000-1000-8000-00805f9b34fb";
    const CHAR_UUID    = "00002a37-0000-1000-8000-00805f9b34fb";

    let bleDevice = null;
    let bleChar = null;
    let lastSentSpeed = -1;
    let lastSendTime = 0;

    async function connectBLE() {
      const statusDiv = document.getElementById("status");
      const btn = document.getElementById("btnConnect");

      try {
        statusDiv.innerText = "Klasik65 aranıyor...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Klasik65" }],
          optionalServices: [SERVICE_UUID]
        });

        statusDiv.innerText = "Cihaza bağlanılıyor...";
        const server = await bleDevice.gatt.connect();

        statusDiv.innerText = "Servis çözülüyor...";
        const service = await server.getPrimaryService(SERVICE_UUID);

        statusDiv.innerText = "Karakteristik alınıyor...";
        bleChar = await service.getCharacteristic(CHAR_UUID);

        statusDiv.innerText = "Bağlandı! GPS Takibi Başlatılıyor...";
        statusDiv.style.color = "#00E5FF";
        btn.innerText = "BAĞLANDI";
        btn.disabled = true;

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        startGPSWatch();
      } catch (error) {
        console.error(error);
        statusDiv.innerText = "Hata: " + error.message;
        statusDiv.style.color = "#FF5252";
      }
    }

    function onDisconnected() {
      const statusDiv = document.getElementById("status");
      const btn = document.getElementById("btnConnect");
      statusDiv.innerText = "Bağlantı koptu. Tekrar bağlanın.";
      statusDiv.style.color = "#FF5252";
      btn.innerText = "YENİDEN BAĞLAN";
      btn.disabled = false;
      bleChar = null;
    }

    function startGPSWatch() {
      if (!("geolocation" in navigator)) {
        document.getElementById("gpsStatus").innerText = "Cihazda GPS desteği bulunamadı.";
        return;
      }

      const options = {
        enableHighAccuracy: true,
        maximumAge: 500,
        timeout: 5000
      };

      navigator.geolocation.watchPosition(handlePosition, handleGPSError, options);
    }

    function handlePosition(pos) {
      const rawSpeedMps = pos.coords.speed; // m/s cinsinden hız
      let kmh = 0;

      if (rawSpeedMps !== null && rawSpeedMps > 0) {
        kmh = Math.round(rawSpeedMps * 3.6);
      }

      document.getElementById("dispSpeed").innerText = kmh;
      document.getElementById("gpsStatus").innerText = 
        `Doğruluk: ±${Math.round(pos.coords.accuracy)}m`;

      sendSpeedToESP32(kmh);
    }

    function handleGPSError(err) {
      document.getElementById("gpsStatus").innerText = "GPS Hatası: " + err.message;
    }

    async function sendSpeedToESP32(speed) {
      if (!bleChar) return;

      const now = Date.now();
      // ESP32-C3 BLE katmanını boğmamak için en az 150ms arayla veya hız değişiminde yolla
      if (speed === lastSentSpeed && (now - lastSendTime < 1000)) return;
      if (now - lastSendTime < 150) return;

      try {
        const payload = `S:${speed}\n`;
        const encoder = new TextEncoder();
        await bleChar.writeValueWithoutResponse(encoder.encode(payload));
        lastSentSpeed = speed;
        lastSendTime = now;
      } catch (e) {
        console.warn("BLE Yazma hatası:", e);
      }
    }
  </script>
</body>
</html>
